name: build-uqmi

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout my fork
        uses: actions/checkout@v4
        with:
          ref: openwrt-21.02
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache clang cmake cpio curl device-tree-compiler ecj fastjar flex gawk gettext gcc-multilib \
            g++-multilib git gperf haveged help2man intltool lib32gcc-s1 libc6-dev-i386 libelf-dev libglib2.0-dev \
            libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libreadline-dev \
            libssl-dev libtool lld lrzsz mkisofs msmtp nano ninja-build p7zip-full patch pkgconf \
            python-is-python3 python3 python3-pip python3-ply python3-docutils qemu-utils re2c rsync scons squashfs-tools subversion \
            swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev

      - name: Update feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Prepare config
        run: |
          cp -f defconfig/mt7981-ax3000.config .config
          cat >> .config <<'EOF'
          CONFIG_PACKAGE_uqmi=m
          EOF
          make defconfig

      - name: Build tools and toolchain
        run: |
          make tools/install -j$(nproc) V=s
          make toolchain/install -j$(nproc) V=s

      - name: Build uqmi only
        run: |
          make package/network/utils/uqmi/compile -j$(nproc) V=s

      - name: Collect ipk
        run: |
          mkdir -p artifact
          find bin/packages -name 'uqmi_*.ipk' -exec cp -v {} artifact/ \;
          find bin/packages -name 'libubox*.ipk' -exec cp -v {} artifact/ \; || true
          find bin/packages -name 'libblobmsg-json*.ipk' -exec cp -v {} artifact/ \; || true
          find bin/packages -name 'libjson-c*.ipk' -exec cp -v {} artifact/ \; || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: uqmi-ipk
          path: artifact/*.ipk
